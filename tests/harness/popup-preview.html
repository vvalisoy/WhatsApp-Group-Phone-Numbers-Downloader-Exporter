<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WA Group Number Exporter</title>
  <link rel="stylesheet" href="../../src/popup/popup.css">
</head>
<body>
  <header>
    <img src="../../src/../icons/icon48.png" alt="" width="24" height="24">
    <h1>WA Group Number Exporter</h1>
    <button id="help" class="link help" title="How to use">How to use</button>
  </header>

  <p id="notice" class="notice" hidden></p>
  <button id="openWa" class="primary wide" hidden>Open WA Web</button>

  <section class="card">
    <div id="group" class="group">No group yet</div>
    <div class="status"><span id="dot" class="dot"></span><span id="statusText">Ready</span></div>
    <div class="stats">
      <div><b id="total">0</b><span>members</span></div>
      <div><b id="withPhone">0</b><span>with number</span></div>
      <div><b id="noPhone">0</b><span>no number</span></div>
    </div>
  </section>

  <label class="toggle">
    <input type="checkbox" id="fullMode">
    <span class="switch" aria-hidden="true"></span>
    <span class="toggle-text">
      <span>Full mode</span>
      <small>Also gets saved contacts' numbers</small>
    </span>
  </label>

  <p id="hint" class="hint"></p>

  <div class="row">
    <button id="start" class="primary">Start</button>
    <button id="stop">Stop</button>
  </div>

  <div class="export">
    <span class="label">Export</span>
    <div class="row3">
      <button id="csv">CSV</button>
      <button id="xlsx">Excel</button>
      <button id="vcf">VCF</button>
    </div>
  </div>

  <div class="footer">
    <button id="clear" class="link">Clear</button>
    <button id="diagnose" class="link">Diagnose</button>
  </div>
  <textarea id="report" readonly hidden></textarea>

  <script>
    // Dev-only stub of the chrome.* APIs so the popup renders outside Chrome.
    const state = new URLSearchParams(location.search).get('state') || 'done';
    const recs = Array.from({ length: 142 }, (_, i) => ({ phone: i % 6 ? '+1555' + (1000000 + i) : '', name: 'M' + i, isAdmin: i < 3, hidden: !(i % 6) }));
    const sessions = {
      done: { group: 'Book Club Lisbon 📚', status: 'done', message: 'Done: 142 members', records: recs },
      running: { group: 'Book Club Lisbon 📚', status: 'running', message: 'Scrolling… 87 found', records: recs.slice(0, 87) },
      error: { group: 'Book Club Lisbon 📚', status: 'error', message: 'Members list was closed. Kept 40 collected so far.', records: recs.slice(0, 40) },
    };
    window.chrome = {
      tabs: {
        query: async () => [{ id: 1, url: state === 'offsite' ? 'https://example.com/' : 'https://web.whatsapp.com/' }],
        sendMessage: async () => ({ ok: true }),
        create: (o) => console.log('open', o.url),
      },
      storage: { local: { get: async () => ({ wax_session: sessions[state] }), set: async () => {}, remove: async () => {} }, onChanged: { addListener() {} } },
      scripting: { executeScript: async () => {} },
      downloads: { download: (o, cb) => { console.log('download', o.filename); cb && cb(); } },
      runtime: { getURL: (p) => '../../' + p },
    };
  </script>
  <script src="../../src/lib/phone.js"></script>
  <script src="../../src/lib/filename.js"></script>
  <script src="../../src/lib/export-csv.js"></script>
  <script src="../../src/lib/zip.js"></script>
  <script src="../../src/lib/export-xlsx.js"></script>
  <script src="../../src/lib/export-vcf.js"></script>
  <script src="../../src/popup/popup.js"></script>
</body>
</html>
